<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconen · Het Vierde Spoor</title>
<link rel="stylesheet" href="styles/app.css">
<style>
  .blad { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(188px, 1fr)); }
  .blad.groot { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .kaartje { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; }
  .kaartje svg { color: var(--accent); flex: none; }
  .kaartje span { font-size: 0.8rem; line-height: 1.3; }
  .kaartje code { color: var(--text-3); font-size: 0.68rem; display: block; }
</style>
</head>
<body>
<header class="top"><a class="brand" href="#/"><span class="brand-mark">⁂</span><span>Het Vierde Spoor</span></a></header>
<main>
  <p class="eyebrow">Controlepagina</p>
  <h1>Alle iconen</h1>
  <p class="lede">Elk woord uit de content met het icoon dat eraan gekoppeld is. Klopt er iets niet, dan hoef je alleen dit ene overzicht na te lopen in plaats van elke puzzel apart.</p>
  <div id="blad"></div>
</main>
<script type="module">
  import { WORLDS } from './src/content/worlds.js';
  import { ICOON_VAN } from './src/content/iconen.js';
  import { icoonElement } from './src/ui/icons.js';
  import { portretElement } from './src/ui/personenkunst-geschilderd.js';
  import { tekenGeschilderd } from './src/ui/geschilderd.js';
  import { GESCHILDERD } from './src/ui/meubelkunst-geschilderd.js';
  const MEUBELKUNST = GESCHILDERD;
  const tekenMeubel = (svg, naam, o) => tekenGeschilderd(svg, GESCHILDERD[naam], o);
  import { MEUBELS_VAN } from './src/content/kamersoorten.js';

  const VELDEN = [
    ['persons', 'Personen'], ['objects', 'Voorwerpen'], ['places', 'Plekken'],
    ['meubels', 'Meubels'], ['hidden', 'Het verborgene'], ['times', 'Tijdstippen'],
  ];
  const blad = document.getElementById('blad');

  // De twaalf portretvarianten naast elkaar: zijn ze uit elkaar te houden?
  const pKop = document.createElement('h2');
  pKop.textContent = 'Verdachten (12 varianten)';
  blad.append(pKop);
  const pRij = document.createElement('div');
  pRij.className = 'blad';
  for (let i = 0; i < 12; i++) {
    const kaart = document.createElement('div');
    kaart.className = 'kaartje';
    kaart.append(portretElement(i, String.fromCharCode(65 + i), 40));
    const t = document.createElement('span');
    t.textContent = `verdachte ${i + 1}`;
    kaart.append(t);
    pRij.append(kaart);
  }
  blad.append(pRij);

  // Het meubilair per soort ruimte, zoals het op het bord staat.
  const mKop = document.createElement('h2');
  mKop.textContent = 'Meubels per soort ruimte';
  mKop.style.marginTop = '32px';
  blad.append(mKop);
  for (const [soort, lijst] of Object.entries(MEUBELS_VAN)) {
    const sub = document.createElement('p');
    sub.className = 'label';
    sub.textContent = soort;
    sub.style.marginTop = '20px';
    blad.append(sub);
    const rij = document.createElement('div');
    rij.className = 'blad groot';
    for (const [naam, sleutel] of lijst) {
      const kaart = document.createElement('div');
      kaart.className = 'kaartje';
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 48 48');
      svg.setAttribute('width', 72);
      svg.setAttribute('height', 72);
      svg.style.background = 'var(--vloer, #e8e0d2)';
      svg.style.borderRadius = '4px';
      tekenMeubel(svg, sleutel, { grootte: 48 });
      kaart.append(svg);
      const t = document.createElement('span');
      t.textContent = naam;
      const code = document.createElement('code');
      code.textContent = MEUBELKUNST[sleutel] ? sleutel : 'GEEN TEKENING';
      t.append(code);
      kaart.append(t);
      rij.append(kaart);
    }
    blad.append(rij);
  }
  for (const [veld, kop] of VELDEN) {
    const woorden = [...new Set(WORLDS.flatMap((w) => w[veld] ?? []))];
    const h = document.createElement('h2');
    h.textContent = `${kop} (${woorden.length})`;
    h.style.marginTop = '32px';
    blad.append(h);
    const raster = document.createElement('div');
    raster.className = 'blad';
    for (const woord of woorden) {
      const kaart = document.createElement('div');
      kaart.className = 'kaartje';
      kaart.append(icoonElement(woord, 26));
      const tekst = document.createElement('span');
      tekst.textContent = woord;
      const code = document.createElement('code');
      code.textContent = ICOON_VAN[woord] ?? 'GEEN';
      tekst.append(code);
      kaart.append(tekst);
      raster.append(kaart);
    }
    blad.append(raster);
  }
</script>
</body>
</html>
