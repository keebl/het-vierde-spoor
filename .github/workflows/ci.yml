# CI for Reconstructie. Drafted from _workbench/templates/github/workflows/ci-typescript.yml,
# rewritten for this project: no TypeScript, no linter, no unit-test runner — the keuring
# (`tools/keuring.mjs`) is the test suite. Keep the commands equal to CLAUDE.md "Commands".
#
# The verdict is read from the `volledige keuring exit=` line, not from npm's exit code:
# `npm run` can report green while a check was red (CLAUDE.md, Gotchas).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the run it replaces; runs on main always finish.
# Before this, two superseded runs on PR #28 each burned 40 minutes x 7 jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wijzigingen:
    # Does this pull request touch anything the keuring judges? Only text that no check reads
    # (docs, specs, design, markdown) skips the heavy matrix. Anything else, a workflow file
    # included, runs it: a list of what may skip fails safe, a list of what must run does not.
    name: what changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      zwaar: ${{ steps.kijk.outputs.zwaar }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: kijk
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > gewijzigd.txt
          cat gewijzigd.txt
          # Not `grep -vq`: on macOS it said "docs only" for a list with src/x.js in it.
          if [ -n "$(grep -vE '^(docs/|specs/|design/)|\.md$' gewijzigd.txt)" ]; then echo zwaar=true; else echo zwaar=false; fi >> "$GITHUB_OUTPUT"

  snel:
    name: keuring (fast, 3 checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fast keuring
        run: |
          npm run check:snel 2>&1 | tee keuring.txt
          grep -q 'volledige keuring exit=0' keuring.txt

  volledig:
    name: keuring (${{ matrix.toets }})
    # The heavy checks of `npm run check:all`, side by side. In one job they took ~22 minutes
    # on a laptop and ran past the 45-minute limit on a hosted runner (PR #15, after levels
    # 5 and 6 got slower to build). The three light checks run in `snel` above. Pull requests
    # only, so a push to main is not held up by a second full run of what the PR already ran.
    needs: wijzigingen
    if: github.event_name == 'pull_request' && needs.wijzigingen.outputs.zwaar == 'true'
    runs-on: ubuntu-latest
    # The motor and the sweep take the level 5-6 room boards from pool/ (`--voorraad`);
    # building them took half an hour and over an hour here (PR #28). The full runs are
    # nightly (nachtrun.yml), and "de voorraad" below proves the store still matches the
    # engine.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        toets:
          - de motor
          - de bibliotheek
          - de aanwijzingen
          - de spreiding
          - de veegronde
          - de weggevers
          - de redenering
          - de voorraad
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Keuring, one check
        run: |
          node tools/keuring.mjs --alleen "${{ matrix.toets }}" 2>&1 | tee keuring.txt
          grep -q 'volledige keuring exit=0' keuring.txt

  volledig-oordeel:
    # One check name that is green only when every heavy check is, or when the pull request
    # touches only text no check reads (then the matrix is skipped on purpose).
    # The name says 8 although there are more checks now: a repository ruleset requires it.
    name: keuring (all 8 checks)
    if: always() && github.event_name == 'pull_request'
    needs: [wijzigingen, snel, volledig]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verdict
        run: |
          echo "wijzigingen: ${{ needs.wijzigingen.result }} (zwaar=${{ needs.wijzigingen.outputs.zwaar }}), snel: ${{ needs.snel.result }}, volledig: ${{ needs.volledig.result }}"
          test "${{ needs.wijzigingen.result }}" = success
          test "${{ needs.snel.result }}" = success
          if [ "${{ needs.wijzigingen.outputs.zwaar }}" = false ]; then
            test "${{ needs.volledig.result }}" = skipped
          else
            test "${{ needs.volledig.result }}" = success
          fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
