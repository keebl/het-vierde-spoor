<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Het Vierde Spoor">
  <!-- Het beeldmerk: drie sporen die iedereen ziet, en een vierde dat je zelf
       moet vinden. Vandaar drie gevulde stippen en een open vierde. -->
  <rect width="64" height="64" rx="14" fill="#3a2e22"/>
  <rect x="4" y="4" width="56" height="56" rx="11" fill="none" stroke="#7a6349" stroke-width="2"/>
  <circle cx="23" cy="24" r="6" fill="#d9a235"/>
  <circle cx="41" cy="24" r="6" fill="#d9a235"/>
  <circle cx="23" cy="42" r="6" fill="#d9a235"/>
  <circle cx="41" cy="42" r="6" fill="none" stroke="#d9a235" stroke-width="2.5" stroke-dasharray="3 3"/>
</svg>
