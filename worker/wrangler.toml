# De AI-laag van de live site. Zie README.md onder "De AI-laag live".
name = "vierdespoor-ai"
main = "index.js"
compatibility_date = "2026-10-01"

# Een puzzel narekenen kost rekentijd: bij twaalf bij twaalf tot drie
# seconden. Tien seconden is ruim genoeg en voorkomt dat een ongelukkig geval
# eindeloos doorrekent. Let op: het GRATIS plan geeft maar 10 milliseconden,
# en daar past dit niet in - zie README.md onder "En live?".
[limits]
cpu_ms = 10000

[vars]
# Alleen verzoeken van deze adressen komen erdoor.
TOEGESTANE_HERKOMST = "https://keebl.github.io"
# Welk model de teksten herschrijft. Sonnet is ruim voldoende voor stijl en
# kost een fractie van Opus; claude-haiku-5-5 is nog een stuk goedkoper.
MODEL = "claude-sonnet-5-5"
# De remmen. Per IP-adres per uur, en een dagtotaal voor de hele site.
UURLIMIET = "20"
DAGLIMIET = "200"

# Hierin komen de herschreven teksten (voor altijd, per puzzel-id) en de
# tellers (die ruimen zichzelf op).
[[kv_namespaces]]
binding = "CACHE"
id = "ZET_HIER_HET_ID_VAN_JE_KV_NAMESPACE"
