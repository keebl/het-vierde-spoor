<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconstructie</title>
<meta name="description" content="Deductiepuzzels die je uitredeneert: zet de verdachten op de plattegrond, één per rij en één per kolom, tot er één antwoord overblijft. Elke keer een nieuwe zaak in een ander decor.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Zodat een gedeelde link in WhatsApp of Slack niet kaal is. Een
     voorbeeldplaatje ontbreekt nog; dat moet een png worden. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Reconstructie">
<meta property="og:title" content="Reconstructie — deductiepuzzels">
<meta property="og:description" content="Zet de verdachten op de plattegrond tot er één antwoord overblijft. Gokken hoeft nooit. Elke keer een nieuwe zaak in een ander decor.">
<meta property="og:url" content="https://reconstructie.app/">
<meta property="og:locale" content="nl_NL">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Patrick Hand schrijft de kamernamen op de vloer, Fredoka zet de koppen.
     Zonder netwerk valt alles terug op de systeemletters. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">
      <!-- Hetzelfde beeldmerk als favicon.svg: een R van muren, met een
           figuur in de kamer die de boog vormt. De tegel eromheen is de
           .brand-mark zelf. -->
      <svg viewBox="0 0 22 22" width="19" height="19" focusable="false">
        <path class="r-muur" d="M6 19.5 V2.5 H12.6 a4.4 4.4 0 0 1 0 8.8 H6 M11 11.3 L16.4 19.5"/>
        <circle class="r-figuur" cx="12.2" cy="6.9" r="1.9"/>
      </svg>
    </span>
    <span class="brand-text">Reconstructie</span>
  </a>
  <nav class="nav">
    <a href="#/maken" data-route="maken">Begin nieuwe puzzel</a>
    <a href="#/puzzels" data-route="puzzels">Alle puzzels</a>
    <a href="#/uitleg" data-route="uitleg">Uitleg</a>
    <!-- Licht of donker. De knop wordt in src/ui/thema.js gevuld, want hij
         moet laten zien welke stand er aan staat. -->
    <button class="themaknop" id="themaknop" type="button"></button>
  </nav>
</header>

<main id="app" aria-live="polite"></main>

<footer class="foot">
  <p>Reconstructie — puzzels, teksten, tekeningen en code zijn eigen werk.</p>
</footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
