<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Het Vierde Spoor</title>
<meta name="description" content="Deductiepuzzels die je uitredeneert: zet de verdachten op de plattegrond, één per rij en één per kolom, tot er één antwoord overblijft. Elke keer een nieuwe zaak in een ander decor.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Zodat een gedeelde link in WhatsApp of Slack niet kaal is. Een
     voorbeeldplaatje ontbreekt nog; dat moet een png worden. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Het Vierde Spoor">
<meta property="og:title" content="Het Vierde Spoor — deductiepuzzels">
<meta property="og:description" content="Zet de verdachten op de plattegrond tot er één antwoord overblijft. Gokken hoeft nooit. Elke keer een nieuwe zaak in een ander decor.">
<meta property="og:url" content="https://keebl.github.io/het-vierde-spoor/">
<meta property="og:locale" content="nl_NL">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Patrick Hand schrijft de kamernamen op de vloer, Fredoka zet de koppen.
     Zonder netwerk valt alles terug op de systeemletters. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">
      <!-- Hier stond het teken ⁂, en dat zijn er drie. Nu hetzelfde beeldmerk
           als in favicon.svg: drie sporen die iedereen ziet, en een vierde dat
           je zelf moet vinden. -->
      <svg viewBox="0 0 22 22" width="17" height="17" focusable="false">
        <circle cx="6" cy="6" r="3.3"/>
        <circle cx="16" cy="6" r="3.3"/>
        <circle cx="6" cy="16" r="3.3"/>
        <circle class="spoor-vier" cx="16" cy="16" r="3.1"/>
      </svg>
    </span>
    <span class="brand-text">Het Vierde Spoor</span>
  </a>
  <nav class="nav">
    <a href="#/maken" data-route="maken">Begin nieuwe puzzel</a>
    <a href="#/uitleg" data-route="uitleg">Uitleg</a>
    <!-- Licht of donker. De knop wordt in src/ui/thema.js gevuld, want hij
         moet laten zien welke stand er aan staat. -->
    <button class="themaknop" id="themaknop" type="button"></button>
  </nav>
</header>

<main id="app" aria-live="polite"></main>

<footer class="foot">
  <p>Het Vierde Spoor — puzzels, teksten, tekeningen en code zijn eigen werk.</p>
</footer>

<script type="module" src="src/main.js"></script>
</body>
</html>
