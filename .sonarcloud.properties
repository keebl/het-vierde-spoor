# SonarCloud automatic analysis.
#
# The free plan caps the whole `keebl` organization at 50,000 lines. With the four modern
# worlds this project grew to ~20,500 lines and every analysis since 2026-11-01 failed on
# that cap, silently. Excluded here: files that are drawings (SVG coordinates) or word
# lists, where Sonar finds nothing, and the keuring scripts. What stays is the engine,
# the game logic, the server and the CSS.
sonar.exclusions=src/ui/bordrand.js,src/ui/meubelkunst*.js,src/ui/personenkunst*.js,src/ui/scenes.js,src/ui/aankleding.js,src/ui/icons.js,src/content/**,tools/**
